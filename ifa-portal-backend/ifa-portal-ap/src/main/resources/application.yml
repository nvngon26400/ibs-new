#----------------------------------------
# サーバー設定
#----------------------------------------
server:
  port: 8081
  servlet:
    context-path: /ifa-portal-ap
    session:
    # セッションのタイムアウト時間（秒）
      timeout: 18000
    # アプリケーション名
    application-display-name: helios-ap

#----------------------------------------
# フレームワーク共通設定
#----------------------------------------
spring:
  jmx:
    # JMX監視を無効化
    enabled: false
  thymeleaf:
    # Thymeleafテンプレートの拡張子
    suffix: .html
    # テンプレートキャッシュを有効化
    cache: true
  servlet:
    multipart:
      # ファイルアップロード最大サイズ
      max-file-size: 20MB
      # リクエスト全体の最大サイズ
      max-request-size: 10000MB
  messages:
    # メッセージエンコーディング
    encoding: utf-8
    # メッセージファイルのベース名
    basename: i18n/messages
    # ローカルが見つからない場合、システムローカルを使用
    fallback-to-system-locale: true
  data:
    redis:
      # Redis配置
      host: d2-sec-helios-webap101.sbisec.int
      port: 6379
      #username: ifa_redis_user
      #password: ifaRedisPwd
  application:
    version: "@project.version@"

#----------------------------------------
# データベース設定情報
#----------------------------------------
  datasource:
    cordys:
      name: cordys
      type: com.zaxxer.hikari.HikariDataSource
      url: 'jdbc:oracle:thin:@10.39.60.21:1531/DOETIA01P'
      username: 'cordys'
      password: 'cordys'
      driver-class-name: 'oracle.jdbc.driver.OracleDriver'
      mybatis:
        type-aliases-package: com.sbibits.earth.dao.typehandler,com.sbibits.horus.ap.common.typehandler
        type-handlers-package: com.sbibits.earth.dao.typehandler,com.sbisec.helios.ap.common.typehandler
        configuration:
          cache-enabled: false
          map-underscore-to-camel-case: true
          use-column-label: true
          jdbc-type-for-null: 'NULL'
      transaction:
        default-timeout: 60
      hikari:
        auto-commit: true
        connection-timeout: 30000
        max-lifetime: 1800000
        maximum-pool-size: 10
        leak-detection-threshold: 50000
        data-source-properties:
          oracle.jdbc.ReadTimeout: 1800000
          oracle.net.disableOob: "true"
    etintra:
      name: etintra
      type: com.zaxxer.hikari.HikariDataSource
      url: 'jdbc:oracle:thin:@10.39.60.21:1531/DOETIA01P'
      username: 'etintra'
      password: 'etintra01'
      driver-class-name: 'oracle.jdbc.driver.OracleDriver'
      mybatis:
        type-aliases-package: com.sbibits.earth.dao.typehandler,com.sbisec.helios.ap.common.typehandler
        type-handlers-package: com.sbibits.earth.dao.typehandler,com.sbisec.helios.ap.common.typehandler
        configuration:
          cache-enabled: false
          map-underscore-to-camel-case: true
          use-column-label: true
          jdbc-type-for-null: 'NULL'
      transaction:
        default-timeout: 60
      hikari:
        auto-commit: true
        connection-timeout: 30000
        max-lifetime: 1800000
        maximum-pool-size: 10
        leak-detection-threshold: 50000
        
    mariadb:
      name: mariadb
      url: 'jdbc:mariadb://10.143.22.122:3306/stockmaster'
      username: 'mtinfo_ifauser_ro_onpre'
      password: 'ifausr'
      driver-class-name: 'org.mariadb.jdbc.Driver'
#----------------------------------------
# Async config
#----------------------------------------
  task:
    execution:
      pool:
        core-size: 64
      shutdown:
        await-termination: true
#----------------------------------------
# ヘルスチェック設定
#----------------------------------------
management:
  health:
    defaults:
      enabled: false
  endpoint:
    mappings:
      enabled: true

#----------------------------------------
# カスタム変数
#----------------------------------------
#security-ignore: /**, /actuator/health
cors:
  # カウンターパートWebサービス、CeresAPサービス
  addMapping: /** 
  allowedMethods: HEAD,GET,POST,OPTIONS
  allowedHeaders: Authorization,Cache-Control,X-User-Agent,Content-Type,X-XSRF-TOKEN,X-Token
  maxAge: 3600
  allowCredentials: true

mail:
  # メール
  protocol: smtp
  host: d2-sec-switch-smtp001.sbisec.int
  port: 8025
  timeout: 3000
  interval: 100

app:
  # セキュリティを無視するパス
  security:
    ignore: /int/api/*, /actuator/health, /h2-console/*
  # XSS対策
  xss:
    enabled: true
    excludes: 
  timeout: 18000
  version: '1.0.8'

responsivesite:
  # レスポンシブサイトの共通キー
  commonKey: 'Z15zF3vMGmnfKwki'

logging:
  level:
    # HikariCPのログレベル
    com.zaxxer.hikari: DEBUG
    com.zaxxer.hikari.pool.HikariPool: INFO
    com.zaxxer.hikari.HiKariConfig: DEBUG

